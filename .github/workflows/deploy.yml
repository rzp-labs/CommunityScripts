name: Publish maintained plugin release to GitHub Pages

# Publishing a reviewed, non-prerelease GitHub release is the explicit trigger.
# Branch pushes and pull requests never deploy a feed.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maintained-plugin-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rzp-labs/CommunityScripts' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'pythontoolsinstaller-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - name: Build stable feed from the publication allowlist
        run: ./build_site.sh _site/stable
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
